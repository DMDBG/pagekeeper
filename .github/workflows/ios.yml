name: Build iPhone app (IPA)

permissions:
  contents: write   # to publish each version as a GitHub release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the build number counts every change

      - name: Bundle libraries and draw icons
        run: bash scripts/prepare-web.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Pagekeeper.xcodeproj \
            -scheme Pagekeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.$(git rev-list --count HEAD)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build | tail -n 40

      - name: Package Pagekeeper.ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pagekeeper.app Payload/
          test -f Payload/Pagekeeper.app/web/index.html   # the reader must be inside the app
          zip -qry Pagekeeper.ipa Payload
          ls -lh Pagekeeper.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pagekeeper-ipa
          path: ios/Pagekeeper.ipa
          retention-days: 30

      - name: Make the AltStore / SideStore source
        run: |
          v="1.0.$(git rev-list --count HEAD)"
          size=$(stat -f%z ios/Pagekeeper.ipa)
          base="https://github.com/${GITHUB_REPOSITORY}/releases"
          cp ios/Pagekeeper/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          cat > altstore.json <<EOF
          {
            "name": "Pagekeeper",
            "identifier": "app.pagekeeper.source",
            "sourceURL": "$base/latest/download/altstore.json",
            "apps": [{
              "name": "Pagekeeper",
              "bundleIdentifier": "app.pagekeeper.reader",
              "developerName": "Pagekeeper",
              "subtitle": "Your books and audiobooks, in sync",
              "localizedDescription": "A clean reading app that keeps your place between iPhone and PC, with an audiobook player that follows along in the text.",
              "iconURL": "$base/latest/download/icon.png",
              "tintColor": "#5B7CFA",
              "version": "$v",
              "versionDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "downloadURL": "$base/download/v$v/Pagekeeper.ipa",
              "size": $size,
              "versions": [{
                "version": "$v",
                "buildVersion": "$(git rev-list --count HEAD)",
                "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "downloadURL": "$base/download/v$v/Pagekeeper.ipa",
                "size": $size,
                "minOSVersion": "16.0"
              }]
            }],
            "news": []
          }
          EOF
          python3 -m json.tool altstore.json > /dev/null && echo "source ok"

      - name: Publish to this version's GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="1.0.$(git rev-list --count HEAD)"
          notes="Pagekeeper $v

          - **Windows:** download Pagekeeper-Setup.exe and run it. After this, Pagekeeper updates itself (Settings → About → Check for updates).
          - **iPhone:** download Pagekeeper.ipa (below) and sideload it, or import it into a signing service like Signulous. This link always gives the newest IPA: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Pagekeeper.ipa
          - **AltStore / SideStore / other signers:** add this source and updates come automatically: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore.json
          - **Easiest:** the download page, with buttons for all of this: https://dmdbg.github.io/pagekeeper/download.html"
          # The Windows and iPhone builds run side by side; whichever finishes first makes the release.
          gh release view "v$v" > /dev/null 2>&1 || gh release create "v$v" --title "Pagekeeper $v" --notes "$notes" --target "$GITHUB_SHA" || true
          for i in 1 2 3 4 5 6; do
            gh release upload "v$v" ios/Pagekeeper.ipa altstore.json icon.png --clobber && break
            sleep 15
          done

