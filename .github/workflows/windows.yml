name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the build number counts every change

      - name: Bundle libraries and draw icons
        shell: bash
        run: bash scripts/prepare-web.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Make Windows icons from the app icon
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 icon ../ios/Pagekeeper/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Add the speech engine for automatic follow-along (whisper.cpp, open source, MIT)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download b5454 -R ggml-org/whisper.cpp -p whisper-bin-x64.zip -D "$RUNNER_TEMP"
          7z x "$RUNNER_TEMP/whisper-bin-x64.zip" -o"$RUNNER_TEMP/wh" -y > /dev/null
          dest="$GITHUB_WORKSPACE/desktop/src-tauri/whisper"
          mkdir -p "$dest"
          src=$(dirname "$(find "$RUNNER_TEMP/wh" -name whisper-cli.exe | head -n 1)")
          cp "$src"/whisper-cli.exe "$src"/whisper.dll "$src"/ggml.dll "$src"/ggml-base.dll "$src"/ggml-cpu-*.dll "$dest/"
          # the Visual C++ runtime, in case a PC doesn't have it
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$d" "$dest/" || true; done
          curl -sSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/b5454/LICENSE -o "$dest/LICENSE-whisper.cpp.txt"
          ls -l "$dest"

      - name: Build installer
        working-directory: desktop
        shell: bash
        run: |
          v="1.0.$(git rev-list --count HEAD)"
          echo "Building Pagekeeper $v"
          npx --yes @tauri-apps/cli@2 build --config "{\"version\":\"$v\"}"

      - name: Name the installer
        shell: bash
        run: |
          f=$(ls desktop/src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          cp "$f" Pagekeeper-Setup.exe
          ls -lh Pagekeeper-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Pagekeeper-Windows
          path: Pagekeeper-Setup.exe
          retention-days: 30
