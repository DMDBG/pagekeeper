<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagekeeper text</title>
<style>
/* The pop-out text window (Windows app): borderless and always on top. Drag it anywhere.
   "Just text" makes the window see-through, so only the outlined letters show on your screen. */
:root{color-scheme:dark;--fg:#FFFFFF;--bg:#111318;--size:24px}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
body.solid{background:var(--bg)}
body:active{cursor:grabbing}
#t{box-sizing:border-box;height:100%;overflow:auto;padding:12px 18px;font:var(--size)/1.45 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;white-space:pre-wrap;scrollbar-width:none}
#t::-webkit-scrollbar{display:none}
body.clear #t{font-weight:600;text-shadow:0 0 1px var(--bg),1.5px 1.5px 0 var(--bg),-1.5px -1.5px 0 var(--bg),1.5px -1.5px 0 var(--bg),-1.5px 1.5px 0 var(--bg),0 1.5px 0 var(--bg),0 -1.5px 0 var(--bg),1.5px 0 0 var(--bg),-1.5px 0 0 var(--bg)}
/* a faint frame only while the mouse is over it, so you can find the edges to drag or resize */
body.clear:hover{box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}
#t.speaking{display:flex;align-items:center}
#t.speaking > div{width:100%}
mark{background:color-mix(in srgb,var(--fg) 30%,transparent);color:inherit;border-radius:4px;padding:0 2px}
body.clear mark{background:transparent;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.hint{opacity:.7;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px}
</style>
</head>
<body class="clear" data-tauri-drag-region>
<div id="t" data-tauri-drag-region><div class="hint" data-tauri-drag-region>Open a book in Pagekeeper.</div></div>
<script>
(() => {
  const T = window.__TAURI__;
  const box = document.getElementById("t");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function show(p){
    const r = document.documentElement.style;
    r.setProperty("--fg", p.fg); r.setProperty("--bg", p.bg); r.setProperty("--size", p.size + "px");
    document.body.classList.toggle("clear", p.style === "clear");
    document.body.classList.toggle("solid", p.style !== "clear");
    box.classList.toggle("speaking", !!p.speaking);
    let html;
    if (!p.text) html = `<div class="hint" data-tauri-drag-region>${esc(p.hint || "Open a book in Pagekeeper.")}</div>`;
    else if (p.word) {
      const [s, n] = p.word;
      html = `<div data-tauri-drag-region>${esc(p.text.slice(0, s))}<mark data-tauri-drag-region>${esc(p.text.slice(s, s + n))}</mark>${esc(p.text.slice(s + n))}</div>`;
    } else html = `<div data-tauri-drag-region>${esc(p.text)}</div>`;
    box.innerHTML = html;
    const m = box.querySelector("mark"); if (m) m.scrollIntoView({ block: "center" });
    else if (!p.speaking) box.scrollTop = 0;
  }
  if (T && T.event) {
    T.event.listen("pk-caption", e => show(e.payload));
    T.event.emitTo("main", "pk-caption-ready", null).catch(() => {});
    addEventListener("beforeunload", () => { T.event.emitTo("main", "pk-caption-closed", null).catch(() => {}); });
  }
})();
</script>
</body>
</html>
