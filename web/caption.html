<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagekeeper text</title>
<style>
/* The pop-out text window (Windows app): borderless and always on top. Drag it anywhere.
   "Just text" makes the window see-through, so only the outlined letters show on your screen. */
:root{color-scheme:dark;--fg:#FFFFFF;--bg:#111318;--size:24px}
body{display:flex;flex-direction:column}
#info{flex:none;padding:0 18px 8px;font:13px system-ui,"Segoe UI",sans-serif;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.clear #info{font-weight:600;text-shadow:0 0 1px var(--bg),1px 1px 0 var(--bg),-1px -1px 0 var(--bg),1px -1px 0 var(--bg),-1px 1px 0 var(--bg)}
/* Hide when paused: fades out a moment after the audio stops */
body.gone{background:transparent!important}
body.gone #t,body.gone #info{opacity:0;transition:opacity .4s 1s}
#t,#info{transition:opacity .25s}
body.locked:hover{box-shadow:none!important}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none}
body.solid{background:var(--bg)}
body:active{cursor:grabbing}
#t{box-sizing:border-box;flex:1;min-height:0;overflow:auto;padding:12px 18px;font:var(--size)/1.45 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;white-space:pre-wrap;scrollbar-width:none}
#t::-webkit-scrollbar{display:none}
body.clear #t{font-weight:600;text-shadow:0 0 1px var(--bg),1.5px 1.5px 0 var(--bg),-1.5px -1.5px 0 var(--bg),1.5px -1.5px 0 var(--bg),-1.5px 1.5px 0 var(--bg),0 1.5px 0 var(--bg),0 -1.5px 0 var(--bg),1.5px 0 0 var(--bg),-1.5px 0 0 var(--bg)}
/* a faint frame only while the mouse is over it, so you can find the edges to drag or resize */
body.clear:hover{box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}
#t.speaking{display:flex;align-items:center}
#t.speaking > div{width:100%}
mark{background:color-mix(in srgb,var(--fg) 30%,transparent);color:inherit;border-radius:4px;padding:0 2px}
body.clear mark{background:transparent;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
#bar{position:fixed;inset:auto 4px 4px 4px;display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#1B1F27;border:1px solid #3A4150;border-radius:8px;cursor:default;font:13px system-ui,"Segoe UI",sans-serif}
#bar button{flex:1 1 auto;background:#2A303B;color:#fff;border:0;border-radius:6px;padding:5px 8px;font:inherit;cursor:pointer}
#bar button:hover{background:#3A4252}
.hint{opacity:.7;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px}
/* the whole page (pagecap.js): a solid page you drag by its top bar */
#pg{display:none}
body.pagemode{background:var(--bg)!important;cursor:default}
body.pagemode.pclear{background:transparent!important}
body.pagemode.pclear:hover{box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}
body.pagemode #t,body.pagemode #info{display:none}
body.pagemode #pg{display:block;position:fixed;inset:0}
body.gone #pg{opacity:0;transition:opacity .4s 1s}
</style>
</head>
<body class="clear" data-tauri-drag-region>
<div id="t" data-tauri-drag-region><div class="hint" data-tauri-drag-region>Open a book in Pagekeeper.</div></div>
<div id="info" data-tauri-drag-region hidden></div>
<div id="pg"></div>
<script src="pagecap.js"></script>
<script>
(() => {
  const T = window.__TAURI__;
  const box = document.getElementById("t");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let pp = null;
  function show(p){
    const r = document.documentElement.style;
    r.setProperty("--fg", p.fg); r.setProperty("--bg", p.bg); r.setProperty("--size", p.size + "px");
    const page = p.mode === "page" && !!window.PKPage;
    document.body.classList.toggle("pagemode", page);
    if (page) {
      if (!pp) pp = PKPage.mount(document.getElementById("pg"), { onCmd: (c, a) => cmd(c, a), drag: true });
      document.body.classList.remove("clear", "solid");
      document.body.classList.toggle("pclear", p.pclear === true);
      pp.update(p);
      document.body.classList.toggle("gone", !!p.hidden);
      document.body.classList.toggle("locked", !!p.locked);
      setThrough(!!p.locked || !!p.hidden);
      return;
    }
    document.body.classList.toggle("clear", p.style === "clear");
    document.body.classList.toggle("solid", p.style !== "clear");
    box.classList.toggle("speaking", !!p.speaking);
    let html;
    if (!p.text) html = `<div class="hint" data-tauri-drag-region>${esc(p.hint || "Open a book in Pagekeeper.")}</div>`;
    else if (p.word) {
      const [s, n] = p.word;
      html = `<div data-tauri-drag-region>${esc(p.text.slice(0, s))}<mark data-tauri-drag-region>${esc(p.text.slice(s, s + n))}</mark>${esc(p.text.slice(s + n))}</div>`;
    } else html = `<div data-tauri-drag-region>${esc(p.text)}</div>`;
    box.innerHTML = html;
    const info = document.getElementById("info"); info.textContent = p.info || ""; info.hidden = !p.info;
    document.body.classList.toggle("gone", !!p.hidden);
    document.body.classList.toggle("locked", !!p.locked);
    // Locked or hidden: clicks go straight through this window to whatever is under it.
    setThrough(!!p.locked || !!p.hidden);
    const m = box.querySelector("mark"); if (m) m.scrollIntoView({ block: "center" });
    else if (!p.speaking) box.scrollTop = 0;
  }
  /* Right-click menu. A real Windows menu, so it isn't cut off by this small window;
     if that can't open, a row of buttons shows across the pop-out instead. */
  let last = {}, through = null;
  function setThrough(on){
    if (on === through || !T || !T.window) return; through = on;
    try { T.window.getCurrentWindow().setIgnoreCursorEvents(on).catch(() => {}); } catch {}
  }
  const cmd = (c, a) => T && T.event && T.event.emitTo("main", "pk-caption-cmd", { ...(a || {}), cmd: c }).catch(() => {});
  const items = () => [
    last.audio || last.speaking ? ["play", last.playing ? "Pause" : "Play"] : null,
    last.audio ? ["back", "Back a few seconds"] : null,
    null,
    ["mode", last.mode === "page" ? "Show one sentence" : "Show the whole page"],
    ...(last.mode === "page" ? [["size-phone", "Phone size"], ["size-tablet", "Tablet size"], ["size-book", "Book page size"], ["size-wide", "Wide size"], ["gray", "Gray until it's read", last.gray !== false], ["pclear", "No background", last.pclear === true]] : []),
    null,
    ["bigger", "Bigger text"],
    ["smaller", "Smaller text"],
    last.mode === "page" ? null : ["style", last.style === "clear" ? "Show a background" : "Just the text (see-through)"],
    null,
    ["lock", "Lock in place (clicks go through)", !!last.locked],
    ["autohide", "Hide when paused", !!last.autohide],
    ["info", "Show chapter and time left", !!last.showInfo],
    null,
    ["main", "Show Pagekeeper"],
    ["close", "Close pop-out"],
  ].filter((x, i, a) => x || (i > 0 && a[i - 1]));
  function fallbackBar(){
    let bar = document.getElementById("bar");
    if (bar) { bar.remove(); return; }
    bar = document.createElement("div"); bar.id = "bar";
    bar.innerHTML = items().filter(Boolean).map(([c, l, on]) => `<button data-c="${c}">${on ? "✓ " : ""}${esc(l)}</button>`).join("");
    bar.onclick = e => { const b = e.target.closest("button"); if (b) { cmd(b.dataset.c); bar.remove(); } };
    document.body.append(bar);
    setTimeout(() => addEventListener("pointerdown", function off(e){ if (!bar.contains(e.target)) { bar.remove(); removeEventListener("pointerdown", off, true); } }, true), 0);
  }
  addEventListener("contextmenu", async e => {
    e.preventDefault();
    try {
      const M = T.menu;
      const menu = await M.Menu.new({ items: await Promise.all(items().map(x => x
        ? (x.length > 2 ? M.CheckMenuItem.new({ id: x[0], text: x[1], checked: x[2], action: () => cmd(x[0]) }) : M.MenuItem.new({ id: x[0], text: x[1], action: () => cmd(x[0]) }))
        : M.PredefinedMenuItem.new({ item: "Separator" }))) });
      await menu.popup();
    } catch { fallbackBar(); }
  });
  addEventListener("keydown", e => { if (e.key === "Escape") { const b = document.getElementById("bar"); if (b) b.remove(); } });

  if (T && T.event) {
    T.event.listen("pk-caption", e => { last = e.payload || {}; show(last); });
    T.event.emitTo("main", "pk-caption-ready", null).catch(() => {});
    addEventListener("beforeunload", () => { T.event.emitTo("main", "pk-caption-closed", null).catch(() => {}); });
  }
})();
</script>
</body>
</html>
