[package]
name = "pagekeeper"
version = "1.0.0"
description = "Pagekeeper: books and audiobooks with your place synced between devices"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
